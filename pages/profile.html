<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Settings - Shelter Pawtners</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">

    <!-- Single Master CSS File -->
    <link rel="stylesheet" href="../css/master.css">
    
</head>
<body>
    <!-- CLEAN NAVIGATION - Same on ALL pages -->
    <header class="header">
        <!-- Navigation automatically loaded by simple-navigation.js -->
    </header>

    <main>
        <section class="py-xl">
            <div class="container">
                <div style="max-width: 600px; margin: 0 auto;">
                    <h1 class="hero-title text-gradient">👤 User Profile Settings</h1>
                    
                    <div class="info-card" style="margin-top: 2rem;">
                        <h2 class="card-title">Account Information</h2>
                        
                        <div class="form-group">
                            <label>Email Address</label>
                            <input type="email" class="form-input" id="emailInput" readonly>
                        </div>
                        
                        <div class="form-group">
                            <label>Display Name</label>
                            <input type="text" class="form-input" id="nameInput" placeholder="Your name">
                        </div>
                        
                        <div class="form-group">
                            <label>Phone Number</label>
                            <input type="tel" class="form-input" id="phoneInput" placeholder="(555) 123-4567">
                        </div>
                        
                        <div class="form-actions">
                            <button type="button" class="btn btn-primary" onclick="saveProfile()">
                                Save Changes
                            </button>
                            <a href="dashboard.html" class="btn btn-secondary">Cancel</a>
                        </div>
                    </div>

                    <div class="info-card" style="margin-top: 2rem;">
                        <h2 class="card-title">🔒 Security</h2>
                        
                        <div class="action-buttons" style="flex-direction: column; gap: 1rem;">
                            <button type="button" class="btn btn-outline" onclick="changePassword()">
                                Change Password
                            </button>
                            <button type="button" class="btn btn-outline" onclick="downloadData()">
                                Download My Data
                            </button>
                            <button type="button" class="btn btn-danger" onclick="deleteAccount()">
                                Delete Account
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/forms.js"></script>
    <!-- SIMPLE NAVIGATION - Clean, consistent, logo and links on same line -->
    <script src="../js/simple-navigation.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        // Initialize Supabase client
        const { createClient } = supabase;
        const supabaseClient = createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey);

        // Load user profile data
        window.addEventListener('DOMContentLoaded', function() {
            loadUserProfile();
        });

        function loadUserProfile() {
            // In demo mode, show placeholder data
            document.getElementById('emailInput').value = 'demo@shelterpawtners.com';
            document.getElementById('nameInput').value = 'Demo User';
            document.getElementById('phoneInput').value = '(555) 123-4567';
        }

        function saveProfile() {
            alert('Profile settings saved! (Demo mode - changes not actually saved)');
        }

        async function changePassword() {
            const newPassword = prompt('Enter your new password (minimum 6 characters):');
            
            if (!newPassword) {
                return; // User cancelled
            }
            
            if (newPassword.length < 6) {
                alert('Password must be at least 6 characters long.');
                return;
            }
            
            const confirmPassword = prompt('Confirm your new password:');
            
            if (newPassword !== confirmPassword) {
                alert('Passwords do not match. Please try again.');
                return;
            }
            
            try {
                const { data, error } = await supabaseClient.auth.updateUser({
                    password: newPassword
                });
                
                if (error) throw error;
                
                alert('Password changed successfully!');
                
            } catch (error) {
                console.error('Password change error:', error);
                alert('Error changing password: ' + error.message);
            }
        }

        function downloadData() {
            alert('Data download feature coming soon!');
        }

        function deleteAccount() {
            if (confirm('Are you sure you want to delete your account? This action cannot be undone.')) {
                alert('Account deletion feature coming soon!');
            }
        }
    </script>

    <!-- UNIFIED FOOTER -->
    <footer class="footer">
        <!-- Footer content automatically loaded by simple-footer.js -->
    </footer>

    <script src="../js/simple-footer.js"></script>
</body>
</html>
