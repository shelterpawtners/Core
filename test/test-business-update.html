<!DOCTYPE html>
<html>
<head><title>Test Business Update</title></head>
<body>
<h1>Testing Business Type Update</h1>
<button onclick="testUpdate()">Test Update to Business</button>
<div id="output"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script>
async function testUpdate() {
  const output = document.getElementById('output');
  const { createClient } = supabase;
  const client = createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey);
  
  output.innerHTML = '<p>Getting session...</p>';
  const { data: { session } } = await client.auth.getSession();
  
  if (!session) {
    output.innerHTML += '<p>Error: No session</p>';
    return;
  }
  
  output.innerHTML += '<p>Testing update to business type...</p>';
  
  // Test the update
  const response = await fetch(`${SUPABASE_CONFIG.url}/functions/v1/admin-update-user`, {
    method: 'POST',
    headers: {
      'Authorization': `Bearer ${session.access_token}`,
      'apikey': SUPABASE_CONFIG.anonKey,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      userId: 'e99753c8-d1e1-4475-a150-b9cc50a18735', // Test User
      updates: { user_type: 'business' }
    })
  });
  
  const result = await response.text();
  output.innerHTML += '<h3>Response:</h3>';
  output.innerHTML += '<p>Status: ' + response.status + '</p>';
  output.innerHTML += '<pre>' + result + '</pre>';
  
  // Also test direct database update
  output.innerHTML += '<h3>Direct Database Test:</h3>';
  const { data, error } = await client
    .from('user_profiles')
    .update({ user_type: 'business' })
    .eq('id', 'e99753c8-d1e1-4475-a150-b9cc50a18735')
    .select();
  
  if (error) {
    output.innerHTML += '<p style="color:red">Error: ' + JSON.stringify(error) + '</p>';
  } else {
    output.innerHTML += '<p style="color:green">Success: ' + JSON.stringify(data) + '</p>';
  }
}
</script>
</body>
</html>
