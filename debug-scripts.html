<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Script Loading Debug - Shelter Pawtners</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #1a1a1a; 
            color: white; 
            padding: 20px; 
        }
        .debug-item { 
            background: #333; 
            padding: 15px; 
            margin: 10px 0; 
            border-radius: 5px; 
        }
        .success { background: #2d5a27; }
        .error { background: #5a2727; }
    </style>
</head>
<body>
    <h1>🔍 Script Loading Debug Test</h1>
    <div id="results"></div>

    <!-- Load scripts in same order as pet-details.html -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="../js/database.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/navigation.js"></script>
    
    <script>
        const results = document.getElementById('results');
        
        function addResult(title, status, details) {
            const div = document.createElement('div');
            div.className = `debug-item ${status}`;
            div.innerHTML = `<h3>${title}</h3><p>${details}</p>`;
            results.appendChild(div);
        }
        
        // Wait a bit for scripts to load
        setTimeout(() => {
            // Test Supabase
            if (typeof supabase !== 'undefined') {
                addResult('✅ Supabase Library', 'success', 'Supabase library loaded successfully');
            } else {
                addResult('❌ Supabase Library', 'error', 'Supabase library failed to load');
            }
            
            // Test SUPABASE_CONFIG
            if (typeof SUPABASE_CONFIG !== 'undefined') {
                addResult('✅ Supabase Config', 'success', `Config loaded: URL starts with ${SUPABASE_CONFIG.url.substring(0, 30)}...`);
            } else {
                addResult('❌ Supabase Config', 'error', 'SUPABASE_CONFIG not defined');
            }
            
            // Test ShelterPawtnerDB
            if (typeof ShelterPawtnerDB !== 'undefined') {
                addResult('✅ ShelterPawtnerDB Class', 'success', 'Database class loaded successfully');
                
                // Try to create instance
                try {
                    const db = new ShelterPawtnerDB();
                    addResult('✅ Database Instance', 'success', 'Database instance created successfully');
                    
                    // Try to initialize
                    db.initialize().then(() => {
                        addResult('✅ Database Initialize', 'success', 'Database initialized successfully');
                    }).catch((error) => {
                        addResult('❌ Database Initialize', 'error', `Initialize failed: ${error.message}`);
                    });
                    
                } catch (error) {
                    addResult('❌ Database Instance', 'error', `Failed to create instance: ${error.message}`);
                }
            } else {
                addResult('❌ ShelterPawtnerDB Class', 'error', 'ShelterPawtnerDB class not defined');
            }
            
            // Test AuthManager
            if (typeof AuthManager !== 'undefined') {
                addResult('✅ AuthManager Class', 'success', 'Auth manager class loaded successfully');
            } else {
                addResult('❌ AuthManager Class', 'error', 'AuthManager class not defined');
            }
            
            // Show what's available on window object
            const windowProps = Object.keys(window).filter(key => 
                key.includes('Shelter') || 
                key.includes('Auth') || 
                key.includes('SUPABASE') ||
                key.includes('supabase')
            );
            
            addResult('🔍 Window Properties', 'success', `Available properties: ${windowProps.join(', ') || 'None found'}`);
            
        }, 2000);
    </script>
</body>
</html>
