<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Eligibility Applications - Shelter Pawtners</title>
    
    <!-- Single Master CSS File -->
    <link rel="stylesheet" href="../css/master.css">
</head>
<body>
<!-- Header matching index page -->
    <header class="header">
        <div class="header-content">
            <a href="../index.html" class="logo">
                <span class="logo-icon">🐾</span>
                <span>Shelter Pawtners</span>
            </a>
            
            <!-- Desktop Navigation -->
            <nav class="desktop-nav">
                <!-- Navigation will be populated by admin-navigation.js -->
            </nav>
            
            <!-- Mobile Menu Toggle -->
            <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
                <div class="hamburger"></div>
                <div class="hamburger"></div>
                <div class="hamburger"></div>
            </button>
        </div>
        
        <!-- Mobile Navigation -->
        <nav class="mobile-nav">
            <!-- Mobile navigation will be populated by admin-navigation.js -->
        </nav>
    </header>

    <main class="main-content">
        <div class="container">
            <div class="admin-header">
                <h1>Eligibility Applications</h1>
                <p class="subtitle">Manage and review pet adoption eligibility applications</p>
            </div>

            <!-- Admin Controls -->
            <div class="admin-controls">
                <div class="filter-controls">
                    <select id="statusFilter" class="form-control">
                        <option value="">All Applications</option>
                        <option value="pending">Pending Review</option>
                        <option value="approved">Approved</option>
                        <option value="rejected">Rejected</option>
                        <option value="needs_info">Needs More Info</option>
                    </select>
                    
                    <input type="date" id="dateFilter" class="form-control" placeholder="Filter by date">
                    
                    <button id="refreshBtn" class="btn btn-primary">
                        <span>🔄</span> Refresh
                    </button>
                </div>

                <div class="stats-overview">
                    <div class="stat-card">
                        <div class="stat-number" id="totalApplications">0</div>
                        <div class="stat-label">Total Applications</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="pendingApplications">0</div>
                        <div class="stat-label">Pending Review</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="approvedApplications">0</div>
                        <div class="stat-label">Approved</div>
                    </div>
                </div>
            </div>

            <!-- Applications List -->
            <div class="applications-container">
                <div id="loadingSpinner" class="loading-spinner" style="display: none;">
                    <div class="spinner"></div>
                    <p>Loading applications...</p>
                </div>

                <div id="applicationsGrid" class="applications-grid">
                    <!-- Applications will be loaded here -->
                </div>

                <div id="noApplications" class="no-applications" style="display: none;">
                    <div class="no-apps-icon">📋</div>
                    <h3>No Applications Found</h3>
                    <p>No eligibility applications match your current filters.</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Application Detail Modal -->
    <div id="applicationModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Application Details</h2>
                <button class="modal-close" onclick="closeApplicationModal()">&times;</button>
            </div>
            
            <div class="modal-body">
                <div id="applicationDetails">
                    <!-- Application details will be loaded here -->
                </div>
                
                <div class="modal-actions">
                    <button id="approveBtn" class="btn btn-success" onclick="updateApplicationStatus('approved')">
                        ✅ Approve
                    </button>
                    <button id="rejectBtn" class="btn btn-danger" onclick="updateApplicationStatus('rejected')">
                        ❌ Reject
                    </button>
                    <button id="needsInfoBtn" class="btn btn-warning" onclick="updateApplicationStatus('needs_info')">
                        ℹ️ Needs More Info
                    </button>
                    <button class="btn btn-secondary" onclick="closeApplicationModal()">
                        Close
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Configuration and Auth -->
    <script src="../js/supabase-config.js"></script>
    <script src="../js/admin-auth.js"></script>
    <script src="../js/auth.js"></script>    <script>
        // Admin functionality for eligibility applications
        let applications = [];
        let currentFilters = { status: '', date: '' };

        // Initialize admin panel
        document.addEventListener('DOMContentLoaded', async function() {
            const authResult = await window.checkAdminAuth();
            if (!authResult) {
                return; // Redirected to login
            }
            setupEventListeners();
            loadApplications();
        });

        function checkAdminAuth() {
            // Deprecated - now using shared admin-auth.js
            // Kept for backwards compatibility but does nothing
            return true;
        }

        function setupEventListeners() {
            // Filter controls
            document.getElementById('statusFilter').addEventListener('change', function() {
                currentFilters.status = this.value;
                filterApplications();
            });

            document.getElementById('dateFilter').addEventListener('change', function() {
                currentFilters.date = this.value;
                filterApplications();
            });

            document.getElementById('refreshBtn').addEventListener('click', loadApplications);

            // Logout functionality
            document.getElementById('logoutBtn').addEventListener('click', async function() {
                await supabase.auth.signOut();
                window.location.href = '../pages/login.html';
            });
        }

        async function loadApplications() {
            showLoading(true);
            
            try {
                const { data, error } = await supabase
                    .from('eligibility_applications')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) {
                    console.error('Error loading applications:', error);
                    showError('Failed to load applications');
                    return;
                }

                applications = data || [];
                updateStats();
                displayApplications(applications);
                
            } catch (error) {
                console.error('Error:', error);
                showError('Failed to load applications');
            } finally {
                showLoading(false);
            }
        }

        function updateStats() {
            const total = applications.length;
            const pending = applications.filter(app => app.status === 'pending').length;
            const approved = applications.filter(app => app.status === 'approved').length;

            document.getElementById('totalApplications').textContent = total;
            document.getElementById('pendingApplications').textContent = pending;
            document.getElementById('approvedApplications').textContent = approved;
        }

        function displayApplications(apps) {
            const grid = document.getElementById('applicationsGrid');
            const noApps = document.getElementById('noApplications');

            if (apps.length === 0) {
                grid.style.display = 'none';
                noApps.style.display = 'block';
                return;
            }

            noApps.style.display = 'none';
            grid.style.display = 'grid';

            grid.innerHTML = apps.map(app => `
                <div class="application-card" onclick="openApplicationModal('${app.id}')">
                    <div class="app-header">
                        <h3>${app.pet_name}</h3>
                        <span class="status-badge status-${app.status}">${formatStatus(app.status)}</span>
                    </div>
                    
                    <div class="app-details">
                        <p><strong>Owner:</strong> ${app.owner_name}</p>
                        <p><strong>Email:</strong> ${app.owner_email}</p>
                        <p><strong>Phone:</strong> ${app.owner_phone}</p>
                        <p><strong>Shelter:</strong> ${app.shelter_name}</p>
                    </div>
                    
                    <div class="app-footer">
                        <small>Applied: ${formatDate(app.created_at)}</small>
                        ${app.updated_at && app.updated_at !== app.created_at ? 
                            `<small>Updated: ${formatDate(app.updated_at)}</small>` : ''}
                    </div>
                </div>
            `).join('');
        }

        function filterApplications() {
            let filtered = applications;

            if (currentFilters.status) {
                filtered = filtered.filter(app => app.status === currentFilters.status);
            }

            if (currentFilters.date) {
                filtered = filtered.filter(app => 
                    new Date(app.created_at).toDateString() === new Date(currentFilters.date).toDateString()
                );
            }

            displayApplications(filtered);
        }

        async function openApplicationModal(applicationId) {
            const app = applications.find(a => a.id === applicationId);
            if (!app) return;

            const modal = document.getElementById('applicationModal');
            const details = document.getElementById('applicationDetails');

            details.innerHTML = `
                <div class="application-full-details">
                    <div class="detail-section">
                        <h3>Pet Information</h3>
                        <p><strong>Pet Name:</strong> ${app.pet_name}</p>
                        <p><strong>Pet Type:</strong> ${app.pet_type}</p>
                        <p><strong>Pet Age:</strong> ${app.pet_age}</p>
                        <p><strong>Pet Breed:</strong> ${app.pet_breed || 'Not specified'}</p>
                    </div>

                    <div class="detail-section">
                        <h3>Owner Information</h3>
                        <p><strong>Name:</strong> ${app.owner_name}</p>
                        <p><strong>Email:</strong> ${app.owner_email}</p>
                        <p><strong>Phone:</strong> ${app.owner_phone}</p>
                        <p><strong>Address:</strong> ${app.owner_address}</p>
                    </div>

                    <div class="detail-section">
                        <h3>Shelter Information</h3>
                        <p><strong>Shelter:</strong> ${app.shelter_name}</p>
                        <p><strong>Adoption Date:</strong> ${formatDate(app.adoption_date)}</p>
                        <p><strong>Adoption Fee:</strong> $${app.adoption_fee}</p>
                    </div>

                    <div class="detail-section">
                        <h3>Application Status</h3>
                        <p><strong>Current Status:</strong> 
                            <span class="status-badge status-${app.status}">${formatStatus(app.status)}</span>
                        </p>
                        <p><strong>Submitted:</strong> ${formatDate(app.created_at)}</p>
                        ${app.updated_at && app.updated_at !== app.created_at ? 
                            `<p><strong>Last Updated:</strong> ${formatDate(app.updated_at)}</p>` : ''}
                    </div>

                    ${app.documents && app.documents.length > 0 ? `
                        <div class="detail-section">
                            <h3>Documents</h3>
                            <div class="documents-list">
                                ${app.documents.map(doc => `
                                    <a href="${doc.url}" target="_blank" class="document-link">
                                        📄 ${doc.name}
                                    </a>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}
                </div>
            `;

            modal.style.display = 'flex';
            document.body.style.overflow = 'hidden';

            // Store current application ID for status updates
            modal.dataset.applicationId = applicationId;
        }

        function closeApplicationModal() {
            const modal = document.getElementById('applicationModal');
            modal.style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        async function updateApplicationStatus(newStatus) {
            const modal = document.getElementById('applicationModal');
            const applicationId = modal.dataset.applicationId;

            if (!applicationId) return;

            try {
                const { error } = await supabase
                    .from('eligibility_applications')
                    .update({ 
                        status: newStatus,
                        updated_at: new Date().toISOString()
                    })
                    .eq('id', applicationId);

                if (error) {
                    console.error('Error updating status:', error);
                    showError('Failed to update application status');
                    return;
                }

                // Update local data
                const appIndex = applications.findIndex(app => app.id === applicationId);
                if (appIndex !== -1) {
                    applications[appIndex].status = newStatus;
                    applications[appIndex].updated_at = new Date().toISOString();
                }

                // Refresh display
                updateStats();
                filterApplications();
                closeApplicationModal();

                showSuccess(`Application ${formatStatus(newStatus).toLowerCase()}`);

            } catch (error) {
                console.error('Error:', error);
                showError('Failed to update application status');
            }
        }

        // Utility functions
        function formatStatus(status) {
            const statusMap = {
                'pending': 'Pending Review',
                'approved': 'Approved',
                'rejected': 'Rejected',
                'needs_info': 'Needs More Info'
            };
            return statusMap[status] || status;
        }

        function formatDate(dateString) {
            return new Date(dateString).toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function showLoading(show) {
            document.getElementById('loadingSpinner').style.display = show ? 'flex' : 'none';
        }

        function showError(message) {
            // Simple error display - could be enhanced with a proper notification system
            alert('Error: ' + message);
        }

        function showSuccess(message) {
            // Simple success display - could be enhanced with a proper notification system
            alert('Success: ' + message);
        }

        // Close modal when clicking outside
        window.addEventListener('click', function(event) {
            const modal = document.getElementById('applicationModal');
            if (event.target === modal) {
                closeApplicationModal();
            }
        });
    </script>

    <style>
        /* Admin-specific styles */
        .admin-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .admin-header h1 {
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .admin-controls {
            margin-bottom: 2rem;
        }

        .filter-controls {
            display: flex;
            gap: 1rem;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .filter-controls .form-control {
            min-width: 150px;
        }

        .stats-overview {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .applications-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
        }

        .application-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .application-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .app-header h3 {
            color: var(--text-primary);
            margin: 0;
        }

        .status-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status-pending {
            background: rgba(249, 158, 11, 0.2);
            color: #F59E0B;
            border: 1px solid #F59E0B;
        }

        .status-approved {
            background: rgba(34, 197, 94, 0.2);
            color: #22C55E;
            border: 1px solid #22C55E;
        }

        .status-rejected {
            background: rgba(239, 68, 68, 0.2);
            color: #EF4444;
            border: 1px solid #EF4444;
        }

        .status-needs_info {
            background: rgba(99, 102, 241, 0.2);
            color: #6366F1;
            border: 1px solid #6366F1;
        }

        .app-details p {
            margin: 0.5rem 0;
            color: var(--text-secondary);
        }

        .app-footer {
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .app-footer small {
            color: var(--text-muted);
            display: block;
            margin: 0.25rem 0;
        }

        .loading-spinner {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 3rem;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left: 4px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .no-applications {
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
        }

        .no-apps-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: rgba(31, 41, 55, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            max-width: 800px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .modal-header h2 {
            color: var(--text-primary);
            margin: 0;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.5rem;
        }

        .modal-body {
            padding: 1.5rem;
        }

        .detail-section {
            margin-bottom: 2rem;
        }

        .detail-section h3 {
            color: var(--primary-color);
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .detail-section p {
            margin: 0.75rem 0;
            color: var(--text-secondary);
        }

        .documents-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .document-link {
            color: var(--primary-color);
            text-decoration: none;
            padding: 0.5rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            transition: background 0.3s ease;
        }

        .document-link:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .modal-actions {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            flex-wrap: wrap;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .applications-grid {
                grid-template-columns: 1fr;
            }

            .filter-controls {
                flex-direction: column;
                align-items: stretch;
            }

            .modal-content {
                width: 95%;
                margin: 1rem;
            }

            .modal-actions {
                flex-direction: column;
            }

            .stats-overview {
                grid-template-columns: 1fr;

            }
        }
    </style>
     <script src="../js/admin-navigation.js"></script>
    <script src="../js/simple-footer.js"></script>
</body>
