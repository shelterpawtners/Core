<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Database Test - Shelter Pawtners</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px;">
    <div style="max-width: 800px; margin: 0 auto; background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border-radius: 20px; padding: 30px;">
        <h1 style="color: white; text-align: center; margin-bottom: 30px;">🛠️ Quick Database Test</h1>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px;">
            <button onclick="testAuth()" style="background: linear-gradient(45deg, #ff6b6b, #feca57); color: white; border: none; padding: 15px; border-radius: 10px; cursor: pointer;">
                Test Authentication
            </button>
            <button onclick="testUserProfiles()" style="background: linear-gradient(45deg, #48dbfb, #0abde3); color: white; border: none; padding: 15px; border-radius: 10px; cursor: pointer;">
                Check User Profiles
            </button>
            <button onclick="testPetsTable()" style="background: linear-gradient(45deg, #ff9ff3, #f368e0); color: white; border: none; padding: 15px; border-radius: 10px; cursor: pointer;">
                Test Pets Table
            </button>
            <button onclick="createTestPet()" style="background: linear-gradient(45deg, #54a0ff, #2e86de); color: white; border: none; padding: 15px; border-radius: 10px; cursor: pointer;">
                Create Test Pet
            </button>
        </div>
        
        <div id="results" style="background: rgba(0,0,0,0.3); border-radius: 10px; padding: 20px; color: white; font-family: monospace; font-size: 14px; white-space: pre-wrap; max-height: 500px; overflow-y: auto;">
            Click a button to run tests...
        </div>
    </div>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script>
        // Initialize Supabase
        let supabaseClient;
        
        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', () => {
            const { createClient } = supabase;
            supabaseClient = createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey);
            log('Page loaded. Supabase initialized. Ready to test!\n');
        });
        
        function log(message) {
            const results = document.getElementById('results');
            results.textContent += new Date().toLocaleTimeString() + ': ' + message + '\n';
            results.scrollTop = results.scrollHeight;
        }
        
        async function testAuth() {
            log('=== TESTING AUTHENTICATION ===');
            
            if (!supabaseClient) {
                log('Error: Supabase client not initialized');
                return;
            }
            
            try {
                // Get current session
                const { data: { session }, error: sessionError } = await supabaseClient.auth.getSession();
                log('Session: ' + (session ? 'EXISTS' : 'NONE'));
                if (sessionError) log('Session Error: ' + sessionError.message);
                
                if (session) {
                    log('User ID: ' + session.user.id);
                    log('Email: ' + session.user.email);
                    log('Created: ' + session.user.created_at);
                }
                
                // Get current user
                const { data: { user }, error: userError } = await supabaseClient.auth.getUser();
                log('User: ' + (user ? 'EXISTS' : 'NONE'));
                if (userError) log('User Error: ' + userError.message);
                
                if (user) {
                    log('User ID (getUser): ' + user.id);
                    log('User metadata: ' + JSON.stringify(user.user_metadata));
                }
                
            } catch (error) {
                log('Auth test error: ' + error.message);
            }
            
            log('=== AUTH TEST COMPLETE ===\n');
        }
        
        async function testUserProfiles() {
            log('=== TESTING USER PROFILES TABLE ===');
            
            if (!supabaseClient) {
                log('Error: Supabase client not initialized');
                return;
            }
            
            try {
                // Try to select from user_profiles
                const { data, error } = await supabaseClient
                    .from('user_profiles')
                    .select('*');
                    
                if (error) {
                    log('User profiles error: ' + error.message);
                } else {
                    log('User profiles found: ' + data.length);
                    data.forEach(profile => {
                        log('Profile: ' + profile.id + ' - ' + profile.email);
                    });
                }
                
                // Check if current user has a profile
                const { data: { user } } = await supabaseClient.auth.getUser();
                if (user) {
                    const { data: profile, error: profileError } = await supabaseClient
                        .from('user_profiles')
                        .select('*')
                        .eq('id', user.id)
                        .single();
                        
                    if (profileError) {
                        log('Current user profile error: ' + profileError.message);
                    } else {
                        log('Current user profile: ' + JSON.stringify(profile));
                    }
                }
                
            } catch (error) {
                log('User profiles test error: ' + error.message);
            }
            
            log('=== USER PROFILES TEST COMPLETE ===\n');
        }
        
        async function testPetsTable() {
            log('=== TESTING PETS TABLE ===');
            
            if (!supabaseClient) {
                log('Error: Supabase client not initialized');
                return;
            }
            
            try {
                // Try to select from pets
                const { data, error } = await supabaseClient
                    .from('pets')
                    .select('*');
                    
                if (error) {
                    log('Pets table error: ' + error.message);
                } else {
                    log('Pets found: ' + data.length);
                    data.forEach(pet => {
                        log('Pet: ' + pet.name + ' (Owner: ' + pet.owner_id + ')');
                    });
                }
                
            } catch (error) {
                log('Pets table test error: ' + error.message);
            }
            
            log('=== PETS TABLE TEST COMPLETE ===\n');
        }
        
        async function createTestPet() {
            log('=== CREATING TEST PET ===');
            
            if (!supabaseClient) {
                log('Error: Supabase client not initialized');
                return;
            }
            
            try {
                // Get current user
                const { data: { user }, error: userError } = await supabaseClient.auth.getUser();
                
                if (userError || !user) {
                    log('No authenticated user: ' + (userError ? userError.message : 'User is null'));
                    return;
                }
                
                log('Creating pet for user: ' + user.id);
                
                // Try to insert a pet
                const petData = {
                    owner_id: user.id,
                    name: 'Test Pet ' + Date.now(),
                    species: 'dog',
                    breed: 'Mixed',
                    age: 2
                };
                
                log('Pet data: ' + JSON.stringify(petData));
                
                const { data, error } = await supabaseClient
                    .from('pets')
                    .insert([petData])
                    .select();
                    
                if (error) {
                    log('Pet creation error: ' + error.message);
                    log('Error details: ' + JSON.stringify(error));
                } else {
                    log('Pet created successfully!');
                    log('Pet details: ' + JSON.stringify(data[0]));
                }
                
            } catch (error) {
                log('Test pet creation error: ' + error.message);
            }
            
            log('=== TEST PET CREATION COMPLETE ===\n');
        }
        

    </script>
</body>
</html>
